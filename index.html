<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Loci — your room remembers</title>
    <meta name="description" content="Ask about anything. Loci teaches it as a chain of stages placed on the real furniture in your room, checks you on the myths people believe, and brings you back the next day. Mixed reality on Quest, and a walk on any screen." />
    <meta name="theme-color" content="#07061c" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://loci-vr.vercel.app/" />
    <meta property="og:title" content="Loci — your room remembers" />
    <meta property="og:description" content="Ask about anything. Your furniture becomes the explanation, and tomorrow it is still there." />
    <meta property="og:image" content="https://loci-vr.vercel.app/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      html, body { margin: 0; background: #07061c; }
      #boot { position: fixed; inset: 0; display: grid; place-content: center; gap: 18px; text-align: center; color: #fffaf3;
        font: 400 clamp(40px, 7vw, 88px)/1.05 Georgia, serif; z-index: 20; transition: opacity 0.45s ease; }
      #boot small { font: 400 15px/1.4 system-ui, sans-serif; color: rgba(248, 244, 255, 0.6); }
      #boot i { display: block; justify-self: center; width: 120px; height: 2px; border-radius: 2px; overflow: hidden;
        background: linear-gradient(90deg, transparent, #ffd99c, transparent) -120px 0 / 120px 2px no-repeat; animation: boot 1.4s ease-in-out infinite; }
      @keyframes boot { to { background-position: 120px 0; } }
      @media (prefers-reduced-motion: reduce) { #boot i { animation: none; background-position: 0 0; } }
      .boot-done #boot { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">Your room remembers.<i></i><small>Loading the room</small></div>
    <div id="scene-container"></div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
